<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Satelit widgets demo</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #f5f6f8; --fg: #1b1f24; --muted: #5b6470; --line: #dfe3e8; }
  :root[data-theme="dark"] { --bg: #0e1013; --fg: #e8eaed; --muted: #9aa3ae; --line: #2a2f37; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 16px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 18px; margin: 0; }
  .tools { display: flex; gap: 6px; flex-wrap: wrap; }
  button { font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; min-height: 36px; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  main { display: grid; gap: 16px; padding: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); align-items: start; }
  .wide { grid-column: 1 / -1; }
  code { font-size: 12px; color: var(--muted); display: block; margin: 0 0 6px; overflow-wrap: anywhere; }
</style>
</head>
<body>
<header>
  <h1>Satelit widgets</h1>
  <div class="tools" role="group" aria-label="Language">
    <button data-lang="ro" aria-pressed="true">RO</button><button data-lang="ru" aria-pressed="false">RU</button><button data-lang="en" aria-pressed="false">EN</button>
  </div>
  <div class="tools" role="group" aria-label="Theme">
    <button data-theme="light" aria-pressed="true">Light</button><button data-theme="dark" aria-pressed="false">Dark</button>
  </div>
</header>
<main>
  <section><code>&lt;satelit-rates codes="EUR,USD,RON,UAH,RUB"&gt;</code><satelit-rates codes="EUR,USD,RON,UAH,RUB"></satelit-rates></section>
  <section><code>&lt;satelit-converter from="EUR" to="MDL" amount="100"&gt;</code><satelit-converter from="EUR" to="MDL" amount="100"></satelit-converter></section>
  <section><code>&lt;satelit-fuel fuel="a95" limit="6"&gt;</code><satelit-fuel fuel="a95" limit="6"></satelit-fuel></section>
  <section><code>&lt;satelit-prices q="lapte" limit="4"&gt;</code><satelit-prices q="lapte" limit="4"></satelit-prices></section>
  <section><code>&lt;satelit-news limit="5"&gt;</code><satelit-news limit="5"></satelit-news></section>
  <section class="wide"><code>&lt;satelit-cinema city="Chișinău" limit="6"&gt;</code><satelit-cinema city="Chișinău" limit="6"></satelit-cinema></section>
</main>
<script>
  // Where the proxy runs: ?proxy=… , else this page's own origin (the Node proxy serves the demo with STATIC_DIR).
  var p = new URLSearchParams(location.search).get('proxy') || (location.protocol.indexOf('http') === 0 ? location.origin : 'http://127.0.0.1:8787');
  var s = document.createElement('script');
  s.src = '../dist/satelit-widgets.js';
  s.setAttribute('data-proxy', p);
  document.head.appendChild(s);

  var all = function () { return document.querySelectorAll('main > section > :last-child'); };
  document.querySelectorAll('[data-lang]').forEach(function (b) {
    b.onclick = function () {
      document.querySelectorAll('[data-lang]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      document.documentElement.lang = b.dataset.lang;
      all().forEach(function (w) { w.setAttribute('lang', b.dataset.lang); });
    };
  });
  var themes = document.querySelectorAll('[data-theme]');
  themes.forEach(function (b) {
    b.onclick = function () {
      document.querySelectorAll('[data-theme]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      document.documentElement.dataset.theme = b.dataset.theme;
      all().forEach(function (w) { w.setAttribute('theme', b.dataset.theme); });
    };
  });
  // Start in the visitor's theme.
  themes[matchMedia('(prefers-color-scheme: dark)').matches ? 1 : 0].click();
</script>
</body>
</html>
